# Preparation template for core-code use; NOT a complete historical cluster lock.
# Historical baseline used Python 3.12.9 / torch 2.6.0+cu124 / CUDA 12.4 / H100.
# CUDA selection and Gurobi licensing must match the execution platform.
name: liberiarbm-training
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - torch==2.6.0
      - numpy==1.26.4
      - pandas==2.2.3
      - scipy==1.15.2
      - matplotlib==3.10.1
      - munch==4.0.0
      - tqdm==4.67.1
      - openpyxl==3.1.5
      - gurobipy==12.0.1
